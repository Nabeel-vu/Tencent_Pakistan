<!DOCTYPE html>
<html>
<head>
  <title>Payment Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f2f2f2;
      color: #333;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    #main-description {
      margin-top: 50px;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: left;
    }

    #main-description p {
      margin-bottom: 10px;
    }

    .payment-option {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .payment-option input[type="radio"] {
      display: none;
    }

    .payment-option label {
      display: inline-block;
      padding: 10px 20px;
      background-color: #ddd;
      color: #333;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .payment-option label:hover {
      background-color: #ccc;
    }

    .payment-option input[type="radio"]:checked + label {
      background-color: #25D366;
      color: #fff;
    }

    .payment-description {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: left;
    }

    .transaction-id {
      margin-top: 20px;
    }

    .input-label {
      font-size: 16px;
      margin-right: 10px;
    }

    .input-textbox {
      padding: 5px;
      width: 200px;
    }

    .whatsapp-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #25D366;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .whatsapp-btn i {
      margin-right: 5px;
    }

    .whatsapp-btn:hover {
      background-color: #128C7E;
    }
  </style>
</head>
<body>
  <h1>Payment Page</h1>
  
  <div id="main-description">
    <p>Loading...</p>
  </div>

  <div class="payment-option">
    <input type="radio" id="easypaisa-radio" name="payment-option" value="Easy Paisa" onchange="togglePaymentDescription()">
    <label for="easypaisa-radio">Easy Paisa</label>

    <input type="radio" id="jazzcash-radio" name="payment-option" value="Jazz Cash" onchange="togglePaymentDescription()">
    <label for="jazzcash-radio">Jazz Cash</label>

    <input type="radio" id="raast-radio" name="payment-option" value="Raast" onchange="togglePaymentDescription()">
    <label for="raast-radio">Raast</label>
  </div>

  <div id="payment-description" class="payment-description">
    <p id="payment-option-text"></p>
    <p id="whatsapp-message-text"></p>
  </div>

  <div class="transaction-id">
    <label class="input-label">Transaction ID:</label>
    <input id="transaction-id-input" class="input-textbox" type="text" required>
  </div>

  <a id="whatsapp-btn" class="whatsapp-btn" href="#" onclick="sendToWhatsApp()">
    <i class="fab fa-whatsapp"></i> Send to WhatsApp
  </a>

  <script>


function togglePaymentDescription() {
      var paymentOptionText = "";
      var whatsappMessageText = "";
      var radios = document.getElementsByName("payment-option");

      for (var i = 0; i < radios.length; i++) {
        var radio = radios[i];
        if (radio.checked) {
          paymentOptionText = radio.value;
          whatsappMessageText = "Payment Option: " + radio.value;
          break;
        }
      }

      document.getElementById("payment-option-text").textContent = "Selected Payment Option: " + paymentOptionText;
      document.getElementById("whatsapp-message-text").textContent = whatsappMessageText;
      document.getElementById("payment-description").style.display = "block";
    }


    // Get the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const packageName = urlParams.get('package');
    const packagePrice = urlParams.get('price');
    const characterId = urlParams.get('characterId');

    // Update the main description
    const mainDescription = document.getElementById('main-description');
    mainDescription.innerHTML = `
      <p>You have selected ${packageName} package.</p>
      <p>Price: ${packagePrice}</p>
      <p>Your PUBG Character ID: ${characterId}</p>
    `;

    // Send the main description and transaction ID to WhatsApp
    function sendToWhatsApp() {
        var paymentOption = "";
        var radios = document.getElementsByName("payment-option");

      for (var i = 0; i < radios.length; i++) {
        var radio = radios[i];
        if (radio.checked) {
          paymentOption = radio.value;
          break;
        }
    }
      const transactionId = document.getElementById('transaction-id-input').value;

      const message = `
        I have made a payment for the following package:
        Package: ${packageName}
        Price: ${packagePrice}
        PUBG Character ID: ${characterId}
        Payment: ${paymentOption}
        Transaction ID: ${transactionId}
        
      `;

      const whatsappUrl = 'https://api.whatsapp.com/send/?phone=1234567890&text=' + encodeURIComponent(message);
      window.open(whatsappUrl);
    }
  </script>
</body>
</html>
