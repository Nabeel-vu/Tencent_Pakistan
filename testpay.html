<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Button</title>
    <style>
        /* Modal styling */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 60px;
        }

        .modal-content {
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            background-color: #fff;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Payment Button -->
    <button id="payButton">Pay Now</button>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <iframe id="paymentIframe" width="100%" height="600px"></iframe>
        </div>
    </div>

    <script>
        // Get the modal and elements
        var modal = document.getElementById("myModal");
        var btn = document.getElementById("payButton");
        var span = document.getElementsByClassName("close")[0];
        var iframe = document.getElementById("paymentIframe");

        // When the user clicks the button, open the modal and set the iframe src
        btn.onclick = function() {
            iframe.src = "https://pakistan.paymob.com/api/acceptance/iframes/189214?payment_token={payment_key_obtained_previously}";
            modal.style.display = "block";
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
